services:
  # Backend Web Service
  - type: web
    name: reachinbox-backend
    env: node
    plan: standard
    buildCommand: cd backend && npm install && npx prisma generate && npm run build
    startCommand: cd backend && npx prisma db push && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: redis
          name: reachinbox-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: reachinbox-redis
          property: port
      - key: WORKER_CONCURRENCY
        value: 5
      - key: MIN_DELAY_BETWEEN_EMAILS_MS
        value: 2000
      - key: MAX_EMAILS_PER_HOUR
        value: 200
      - key: MAX_EMAILS_PER_HOUR_PER_SENDER
        value: 50

  # Frontend Static Site
  - type: web
    name: reachinbox-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://reachinbox-backend.onrender.com/api

# Managed PostgreSQL Database
databases:
  - name: reachinbox-db
    plan: free
    databaseName: reachinbox_db
    user: reachinbox_user
